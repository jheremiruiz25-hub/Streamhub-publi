<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamHub | Administrador</title><script src="../config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font:15px Arial,sans-serif}header{padding:22px;background:#121a30;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#151f38;border:1px solid #293653;border-radius:14px;padding:18px;margin:14px 0}input,button{padding:12px;border-radius:8px;border:1px solid #405071;margin:5px;background:#0c1428;color:white}button{background:#635bff;border:0;cursor:pointer}button.red{background:#b93855}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#9eacc9}.item{border-top:1px solid #34415e;padding:12px 0}.hidden{display:none}
</style></head><body>
<header><b>STREAMHUB · ADMIN</b><span class="muted">Panel privado</span></header><main>
<section id="login" class="card"><h2>Ingresar</h2><input id="pin" type="password" placeholder="PIN administrador"><button onclick="login()">Entrar</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="grid"><div class="card"><h3>Ventas registradas</h3><h2 id="ventas">0</h2></div><div class="card"><h3>Ganancia</h3><h2 id="ganancia">$0</h2></div><div class="card"><h3>Solicitudes pendientes</h3><h2 id="pendientes">0</h2></div></div>
<div class="card"><h2>Solicitudes de la tienda</h2><div id="solicitudes">Cargando…</div></div>
<div class="card"><h2>Publicar producto</h2><div class="grid"><input id="nombre" placeholder="Nombre del producto"><input id="precio" type="number" placeholder="Precio"><input id="imagen" placeholder="URL de imagen"><input id="descripcion" placeholder="Descripción"></div><label><input id="publicado" type="checkbox" checked> Publicado en la tienda</label><button onclick="guardarProducto()">Guardar producto</button><p id="prodmsg" class="muted"></p></div>
<div class="card"><h2>Productos</h2><div id="productos"></div></div>
<div class="card"><h2>Proveedores</h2><input id="provnombre" placeholder="Nombre"><input id="provcontacto" placeholder="Contacto"><button onclick="guardarProveedor()">Agregar proveedor</button><div id="proveedores"></div></div>
<div class="card"><h2>Ventas</h2><div id="pedidos"></div></div>
</section></main>
<script>
let PIN='';
function api(params,done){const cb='cb_'+Math.random().toString(36).slice(2);window[cb]=d=>{delete window[cb];script.remove();done(d)};const script=document.createElement('script');script.src=window.STREAMHUB_API+'?'+new URLSearchParams({...params,callback:cb});script.onerror=()=>{document.getElementById('msg').textContent='No se pudo conectar con Google Sheets.';delete window[cb]};document.body.appendChild(script)}
function login(){PIN=document.getElementById('pin').value;api({action:'login',pin:PIN},r=>{if(r.ok){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');refresh()}else document.getElementById('msg').textContent='PIN incorrecto'})}
function refresh(){api({action:'panel',pin:PIN},r=>{if(!r.ok)return;const pending=r.solicitudes.filter(x=>x.estado==='PENDIENTE');document.getElementById('pendientes').textContent=pending.length;document.getElementById('ventas').textContent=r.pedidos.length;document.getElementById('ganancia').textContent=money(r.pedidos.reduce((a,x)=>a+(Number(x.ganancia)||0),0));document.getElementById('solicitudes').innerHTML=pending.map(s=>`<div class="item"><b>${esc(s.producto)}</b> · ${esc(s.cliente)} · ${esc(s.telefono)} · ${money(s.precio)}<br><input id="prov_${s.id}" placeholder="Proveedor"><input id="costo_${s.id}" type="number" placeholder="Costo"><button onclick="procesar('${s.id}','ACEPTADA')">Aceptar venta</button><button class="red" onclick="procesar('${s.id}','RECHAZADA')">Rechazar</button></div>`).join('')||'No hay solicitudes pendientes';document.getElementById('productos').innerHTML=r.productos.map(p=>`<div class="item">${esc(p.nombre)} · ${money(p.precio)} · ${String(p.publicado)==='true'?'Publicado':'Oculto'}</div>`).join('');document.getElementById('proveedores').innerHTML=r.proveedores.map(p=>`<div class="item">${esc(p.nombre)} — ${esc(p.contacto)}</div>`).join('');document.getElementById('pedidos').innerHTML=r.pedidos.slice().reverse().map(p=>`<div class="item">${esc(p.fecha)} · ${esc(p.cliente)} · ${esc(p.producto)} · Ganancia ${money(p.ganancia)}</div>`).join('')||'Aún no hay ventas'})}
function procesar(id,estado){if(!confirm(estado==='ACEPTADA'?'¿Confirmar esta venta?':'¿Rechazar esta solicitud?'))return;api({action:'solicitud',pin:PIN,id,estado,proveedor:document.getElementById('prov_'+id)?.value||'',costo:document.getElementById('costo_'+id)?.value||0},r=>{alert(r.ok?'Solicitud actualizada':r.error||'Error');refresh()})}
function guardarProducto(){api({action:'guardarProducto',pin:PIN,nombre:nombre.value,precio:precio.value,imagen:imagen.value,descripcion:descripcion.value,publicado:String(publicado.checked)},r=>{prodmsg.textContent=r.ok?'Producto guardado':'No se pudo guardar';refresh()})}
function guardarProveedor(){api({action:'guardarProveedor',pin:PIN,nombre:provnombre.value,contacto:provcontacto.value},r=>{alert(r.ok?'Proveedor agregado':r.error);refresh()})}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
setInterval(()=>{if(PIN&&!document.getElementById('app').classList.contains('hidden'))refresh()},10000);
</script></body></html>
