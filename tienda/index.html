<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamHub | Tienda</title><script src="../config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f6ff;font:16px Arial,sans-serif}header{position:relative;text-align:center;padding:35px 15px;background:linear-gradient(130deg,#211c58,#101a35)}header h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}header p{margin:0;color:#d9ddf7}.menu-wrap{position:absolute;left:16px;top:22px;z-index:5}.menu-btn{background:#ffffff18;color:white;border:1px solid #ffffff35;border-radius:10px;padding:10px 13px;font-size:22px;cursor:pointer}.menu-panel{display:none;position:absolute;left:0;top:50px;width:220px;background:#182440;border:1px solid #405071;border-radius:12px;padding:8px;box-shadow:0 12px 30px #0008}.menu-panel.open{display:block}.menu-panel button{display:block;width:100%;text-align:left;background:transparent;color:#f4f6ff;padding:12px;border-radius:8px;border:0}.menu-panel button.active,.menu-panel button:hover{background:#635bff}main{max-width:1150px;margin:25px auto;padding:0 16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.heading h2{margin:0}.count{color:#aab5ce;font-size:13px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{min-width:0;background:#151f38;border:1px solid #2d3b5b;border-radius:15px;overflow:hidden;padding:12px;display:flex;flex-direction:column}.card img{width:100%;height:170px;object-fit:cover;border-radius:9px;background:#202d4a}.placeholder{height:170px;display:grid;place-items:center;font-size:48px;background:#202d4a;border-radius:9px}.card h3{font-size:17px;margin:12px 0 6px;overflow-wrap:anywhere}.desc{color:#aab5ce;font-size:13px;line-height:1.4;min-height:36px}.price{font-size:18px;font-weight:bold;margin:10px 0}.buy{margin-top:auto;padding:13px;border-radius:9px;border:0;background:#655bff;color:white;font-weight:bold;font-size:15px;cursor:pointer;width:100%}.empty{color:#aab5ce;padding:25px 0}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:15px;z-index:10}.modal.show{display:grid}.dialog{background:#151f38;padding:22px;border:1px solid #405071;border-radius:15px;width:min(420px,100%)}.dialog input,.dialog button{padding:13px;border-radius:8px;margin:7px 0;width:100%;border:1px solid #405071;background:#0b1429;color:white}.dialog button{background:#655bff;border:0;font-weight:bold;cursor:pointer}.dialog .cancel{background:#47536c}.muted{color:#aab5ce;font-size:13px;line-height:1.4}
@media(max-width:700px){header{padding:31px 58px}header h1{font-size:24px}.menu-wrap{left:12px;top:15px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:8px;border-radius:12px}.card img,.placeholder{height:clamp(105px,31vw,155px)}.card h3{font-size:14px;margin:9px 0 4px}.desc{font-size:11px;min-height:32px}.price{font-size:15px;margin:8px 0}.buy{font-size:13px;padding:11px}.heading h2{font-size:19px}}
@media(max-width:360px){.products{gap:7px}.card{padding:6px}.card h3{font-size:13px}}
</style></head><body>
<header><div class="menu-wrap"><button class="menu-btn" onclick="toggleMenu()" aria-label="Abrir categorías">☰</button><nav id="menu" class="menu-panel"><button class="active" data-cat="Todas" onclick="filterCategory('Todas',this)">Todas las categorías</button><button data-cat="Plataformas" onclick="filterCategory('Plataformas',this)">Plataformas</button><button data-cat="Training" onclick="filterCategory('Training',this)">Training</button><button data-cat="Juegos" onclick="filterCategory('Juegos',this)">Juegos</button><button data-cat="Productividad" onclick="filterCategory('Productividad',this)">Productividad</button></nav></div><h1>STREAMHUB</h1><p>Elige tu suscripción digital</p></header>
<main><div class="heading"><h2 id="sectionTitle">Todos los productos</h2><span id="count" class="count"></span></div><div id="products" class="products"><div class="empty">Cargando productos…</div></div><p id="status" class="muted"></p></main>
<div id="modal" class="modal"><div class="dialog"><h2>Finalizar compra</h2><p id="chosen" class="muted"></p><input id="cliente" placeholder="Tu nombre"><input id="telefono" placeholder="Tu WhatsApp"><button onclick="sendOrder()">Continuar por WhatsApp</button><button class="cancel" onclick="closeModal()">Cancelar</button><p class="muted">Tu pedido quedará pendiente hasta que el administrador lo apruebe. Al abrir WhatsApp, pulsa Enviar para completar el mensaje.</p></div></div>
<script>
let allProducts=[],selected=null,currentCategory='Todas';
function api(params,done){const cb='cb_'+Math.random().toString(36).slice(2);window[cb]=d=>{delete window[cb];script.remove();done(d)};const script=document.createElement('script');script.src=window.STREAMHUB_API+'?'+new URLSearchParams({...params,callback:cb});script.onerror=()=>{document.getElementById('status').textContent='No se pudo cargar el catálogo. Revisa la conexión.';delete window[cb]};document.body.appendChild(script)}
function load(){api({action:'catalogo'},r=>{if(!r.ok){document.getElementById('products').innerHTML='<div class="empty">No se pudo cargar el catálogo.</div>';return}allProducts=r.productos||[];renderProducts()})}
function renderProducts(){const list=currentCategory==='Todas'?allProducts:allProducts.filter(p=>(p.categoria||'Plataformas')===currentCategory);document.getElementById('sectionTitle').textContent=currentCategory==='Todas'?'Todos los productos':currentCategory;document.getElementById('count').textContent=list.length+' productos';const el=document.getElementById('products');if(!list.length){el.innerHTML='<div class="empty">Todavía no hay productos en esta categoría.</div>';return}el.innerHTML=list.map(p=>`<article class="card">${p.imagen?`<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy">`:'<div class="placeholder">▶</div>'}<h3>${esc(p.nombre)}</h3><p class="desc">${esc(p.descripcion||'Suscripción digital')}</p><div class="price">${money(p.precio)}</div><button class="buy" onclick="openModal('${encodeURIComponent(p.id)}','${encodeURIComponent(p.nombre)}')">Comprar ahora</button></article>`).join('')}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}
function filterCategory(cat,btn){currentCategory=cat;document.querySelectorAll('.menu-panel button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('menu').classList.remove('open');renderProducts()}
function openModal(id,name){selected=decodeURIComponent(id);document.getElementById('chosen').textContent='Producto: '+decodeURIComponent(name);document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function sendOrder(){const cliente=document.getElementById('cliente').value.trim(),telefono=document.getElementById('telefono').value.trim();if(!cliente||!telefono){alert('Completa tu nombre y teléfono');return}api({action:'crearSolicitud',productoId:selected,cliente,telefono},r=>{if(!r.ok){alert(r.error||'No se pudo crear el pedido');return}closeModal();window.open(r.whatsapp,'_blank')})}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load();
</script></body></html>
