<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamHub | Tienda</title><script src="../config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f6ff;font:16px Arial}header{text-align:center;padding:38px 15px;background:linear-gradient(130deg,#211c58,#101a35)}main{max-width:1000px;margin:25px auto;padding:0 16px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151f38;border:1px solid #2d3b5b;border-radius:15px;overflow:hidden;padding:15px}.card img{width:100%;height:150px;object-fit:cover;border-radius:9px}.placeholder{height:150px;display:grid;place-items:center;font-size:48px;background:#202d4a;border-radius:9px}button,input{padding:12px;border-radius:8px;border:1px solid #405071;margin:5px 0;width:100%;background:#0b1429;color:white}button{background:#655bff;border:0;font-weight:bold;cursor:pointer}.muted{color:#aab5ce}#modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:15px}.dialog{background:#151f38;padding:22px;border-radius:15px;width:min(420px,100%)}</style></head><body>
<header><h1>STREAMHUB</h1><p>Elige tu suscripción digital</p></header><main><h2>Catálogo</h2><div id="products" class="products">Cargando productos…</div><p id="status" class="muted"></p></main>
<div id="modal"><div class="dialog"><h2>Solicitar producto</h2><p id="chosen"></p><input id="cliente" placeholder="Tu nombre"><input id="telefono" placeholder="Tu WhatsApp"><button onclick="sendOrder()">Continuar por WhatsApp</button><button style="background:#47536c" onclick="closeModal()">Cancelar</button><p class="muted">Tu solicitud quedará pendiente hasta que el administrador la apruebe.</p></div></div>
<script>
let selected=null;
function api(params,done){const cb='cb_'+Math.random().toString(36).slice(2);window[cb]=d=>{delete window[cb];script.remove();done(d)};const script=document.createElement('script');script.src=window.STREAMHUB_API+'?'+new URLSearchParams({...params,callback:cb});script.onerror=()=>{document.getElementById('status').textContent='No se pudo cargar el catálogo. Intenta de nuevo.';delete window[cb]};document.body.appendChild(script)}
function load(){api({action:'catalogo'},r=>{const el=document.getElementById('products');if(!r.ok||!r.productos.length){el.textContent='Pronto tendremos productos disponibles.';return}el.innerHTML=r.productos.map(p=>`<article class="card">${p.imagen?`<img src="${esc(p.imagen)}" alt="">`:'<div class="placeholder">▶</div>'}<h3>${esc(p.nombre)}</h3><p class="muted">${esc(p.descripcion||'Suscripción digital')}</p><h3>${money(p.precio)}</h3><button onclick="openModal('${encodeURIComponent(p.id)}','${encodeURIComponent(p.nombre)}')">Solicitar</button></article>`).join('')})}
function openModal(id,name){selected=decodeURIComponent(id);chosen.textContent=decodeURIComponent(name);modal.style.display='grid'}
function closeModal(){modal.style.display='none'}
function sendOrder(){if(!cliente.value.trim()||!telefono.value.trim()){alert('Completa tu nombre y teléfono');return}api({action:'crearSolicitud',productoId:selected,cliente:cliente.value.trim(),telefono:telefono.value.trim()},r=>{if(!r.ok){alert(r.error||'No se pudo crear la solicitud');return}closeModal();window.open(r.whatsapp,'_blank')})}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load();
</script></body></html>
