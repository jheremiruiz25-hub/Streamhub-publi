<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamHub | Tienda</title><script src="../config.js"></script>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#171923;--muted:#737b8e;--line:#e7e9f0;--accent:#e6ad43;--accentInk:#211805;--shadow:0 5px 20px #1720330c;--soft:#f0f2f7}
body.dark{--bg:#10131b;--panel:#191e29;--ink:#f4f5f8;--muted:#a4adbd;--line:#303746;--accent:#e6ad43;--accentInk:#211805;--soft:#242b38;--shadow:0 5px 20px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Arial;transition:background .2s,color .2s}
.top{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:8}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:10px 12px;font-size:18px;cursor:pointer}.brand{font-weight:900;letter-spacing:.5px;white-space:nowrap}.search{flex:1;max-width:650px;position:relative;margin-left:12px}.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:12px 15px 12px 40px;font:inherit;outline:none}.search span{position:absolute;left:14px;top:10px;color:var(--muted);font-size:18px}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.cart-count{background:#e8f8ee;color:#07864d;border-radius:20px;padding:8px 12px;font-weight:800;cursor:pointer;border:1px solid #ccefd9}
.menu-wrap{position:relative}.menu-panel{display:none;position:absolute;left:0;top:48px;width:230px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px;box-shadow:var(--shadow)}.menu-panel.open{display:block}.menu-panel button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}.menu-panel button.active,.menu-panel button:hover{background:var(--soft)}
main{max-width:1440px;margin:24px auto;padding:0 20px}.hero{background:linear-gradient(115deg,#101116,#28232a);color:white;border-radius:20px;padding:35px 25px;text-align:center;margin-bottom:24px}.hero h1{font-size:clamp(25px,4vw,40px);margin:0 0 8px}.hero p{color:#ddd;margin:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.heading h2{margin:0;font-size:23px}.muted{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-2px)}.card img,.placeholder{width:100%;height:155px;object-fit:contain;border-radius:12px;background:var(--soft)}.placeholder{display:grid;place-items:center;font-size:48px}.card h3{font-size:15px;line-height:1.3;margin:12px 0 6px;min-height:39px}.desc{font-size:12px;color:var(--muted);line-height:1.4;min-height:32px;margin:0}.duration{font-size:12px;color:var(--muted);margin:7px 0}.price{font-size:20px;font-weight:900;margin:4px 0 10px}.old{text-decoration:line-through;color:#a0a5b2;font-size:12px;font-weight:400;margin-right:5px}.actions{display:flex;gap:7px;margin-top:auto}.actions button{flex:1;padding:11px 7px;border-radius:10px;border:0;background:var(--accent);color:var(--accentInk);font-weight:800;cursor:pointer}.actions .add{flex:0 0 43px;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:18px}.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:20;justify-content:center;align-items:center;padding:14px}.overlay.show{display:flex}.dialog{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0003}.dialog.wide{width:min(760px,100%)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;background:var(--soft);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}.detail-img{width:100%;height:210px;object-fit:contain;background:var(--soft);border-radius:12px}.detail-price{font-size:25px;font-weight:900;margin:12px 0}.detail-text{white-space:pre-line;line-height:1.55;color:var(--muted)}.field{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;margin:6px 0;font:inherit}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accentInk);font-weight:900;cursor:pointer;margin-top:8px}.cart-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}.total{font-size:21px;font-weight:900;text-align:right;padding:14px 0}.wa{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;background:#20c66a;color:white;display:grid;place-items:center;text-decoration:none;font-size:25px;box-shadow:0 8px 24px #20c66a55}
@media(max-width:1100px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.top{height:62px;padding:0 10px;gap:7px}.brand{display:none}.search{margin-left:0}.top-actions{gap:5px}.iconbtn{padding:9px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:9px;border-radius:13px}.card img,.placeholder{height:clamp(105px,31vw,150px)}.card h3{font-size:13px;min-height:34px}.desc{font-size:11px;min-height:30px}.price{font-size:17px}.actions button{font-size:12px;padding:10px 5px}.actions .add{flex-basis:37px}.hero{padding:27px 16px}.hero p{font-size:13px}main{padding:0 12px;margin:16px auto}.heading h2{font-size:19px}}
@media(max-width:380px){.top-actions .notify{display:none}.products{gap:7px}.card{padding:7px}.card h3{font-size:12px}}
</style></head><body>
<nav class="top">
 <div class="menu-wrap"><button class="iconbtn" onclick="toggleMenu()" aria-label="Categorías">☰</button><div id="menu" class="menu-panel"><button class="active" data-cat="Todas" onclick="filterCategory('Todas',this)">Todos los productos</button></div></div>
 <div class="brand">STREAMHUB</div>
 <div class="search"><span>⌕</span><input id="search" placeholder="Buscar productos..." oninput="renderProducts()"></div>
 <div class="top-actions"><button class="cart-count" onclick="openCart()">🛒 <span id="cartCount">0</span></button><button class="iconbtn notify" title="Notificaciones" onclick="alert('No tienes notificaciones nuevas')">♧</button><button class="iconbtn" id="themeBtn" title="Cambiar tema" onclick="toggleTheme()">☾</button></div>
</nav>
<main>
 <section class="hero"><h1>Bienvenido a STREAMHUB</h1><p>Tus suscripciones y productos favoritos en un solo lugar, al mejor precio.</p></section>
 <div class="heading"><h2 id="sectionTitle">Conoce nuestro catálogo</h2><span class="muted" id="count"></span></div>
 <section id="products" class="products"><div class="empty">Cargando productos…</div></section><p id="status" class="muted"></p>
</main>
<a class="wa" href="https://wa.me/573205924685" target="_blank" aria-label="WhatsApp">◉</a>

<div id="detailModal" class="overlay" onclick="if(event.target===this)closeOverlay('detailModal')"><div class="dialog wide"><div class="dialog-head"><h2>Información del producto</h2><button class="close" onclick="closeOverlay('detailModal')">✕</button></div><div id="detailBody"></div></div></div>
<div id="cartModal" class="overlay" onclick="if(event.target===this)closeOverlay('cartModal')"><div class="dialog"><div class="dialog-head"><h2>Tu carrito</h2><button class="close" onclick="closeOverlay('cartModal')">✕</button></div><div id="cartBody"></div></div></div>
<div id="checkoutModal" class="overlay" onclick="if(event.target===this)closeOverlay('checkoutModal')"><div class="dialog"><div class="dialog-head"><h2>Finalizar pedido</h2><button class="close" onclick="closeOverlay('checkoutModal')">✕</button></div><p class="muted">Déjanos tus datos. El pedido quedará pendiente de confirmación.</p><input class="field" id="cliente" placeholder="Tu nombre"><input class="field" id="telefono" placeholder="Tu WhatsApp"><button class="primary" onclick="sendOrder()">Enviar pedido por WhatsApp</button></div></div>
<script>
let allProducts=[],categories=[],currentCategory='Todas',cart=JSON.parse(localStorage.getItem('streamhub_cart')||'[]');
function api(params,done){const cb='cb_'+Math.random().toString(36).slice(2);window[cb]=d=>{delete window[cb];script.remove();done(d)};const script=document.createElement('script');script.src=window.STREAMHUB_API+'?'+new URLSearchParams({...params,callback:cb});script.onerror=()=>{document.getElementById('status').textContent='No se pudo conectar con el catálogo. Revisa la conexión.';delete window[cb]};document.body.appendChild(script)}
function load(){api({action:'catalogo'},r=>{if(!r.ok){$('products').innerHTML='<div class="empty">No se pudo cargar el catálogo.</div>';return}allProducts=r.productos||[];categories=r.categorias||[];renderMenu();renderProducts();updateCartCount()})}
function renderMenu(){const m=$('menu');m.innerHTML='';[['Todas','Todos los productos'],...categories.map(c=>[c.nombre,c.nombre])].forEach(([cat,label],i)=>{const b=document.createElement('button');b.textContent=label;if(i===0)b.classList.add('active');b.onclick=()=>filterCategory(cat,b);m.appendChild(b)})}
function renderProducts(){const q=$('search').value.trim().toLowerCase();let list=allProducts.filter(p=>(currentCategory==='Todas'||String(p.categoria)===currentCategory)&&(!q||(String(p.nombre)+' '+String(p.descripcion)+' '+String(p.categoria)).toLowerCase().includes(q)));$('sectionTitle').textContent=currentCategory==='Todas'?'Conoce nuestro catálogo':currentCategory;$('count').textContent=list.length+' productos';$('products').innerHTML=list.map(p=>`<article class="card" onclick="showDetail('${enc(p.id)}')">${p.imagen?`<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy">`:'<div class="placeholder">▶</div>'}<h3>${esc(p.nombre)}</h3><p class="desc">${esc(p.descripcion||'Producto digital')}</p><div class="duration">${esc(p.duracion||'')}</div><div class="price">${Number(p.precioAnterior)>Number(p.precio)?`<span class="old">${money(p.precioAnterior)}</span>`:''}${money(p.precio)}</div><div class="actions"><button class="add" onclick="event.stopPropagation();addCart('${enc(p.id)}')">＋</button><button onclick="event.stopPropagation();quickBuy('${enc(p.id)}')">Comprar ahora</button></div></article>`).join('')||'<div class="empty">No encontramos productos con esa búsqueda.</div>'}
function showDetail(id){const p=allProducts.find(x=>String(x.id)===decodeURIComponent(id));if(!p)return;const chars=String(p.caracteristicas||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);$('detailBody').innerHTML=`${p.imagen?`<img class="detail-img" src="${esc(p.imagen)}" alt="${esc(p.nombre)}">`:''}<h2>${esc(p.nombre)}</h2><div class="detail-price">${money(p.precio)} ${Number(p.precioAnterior)>Number(p.precio)?`<span class="old">${money(p.precioAnterior)}</span>`:''}</div><p class="detail-text">${esc(p.descripcionLarga||p.descripcion||'Consulta con nosotros para más información.')}</p><p><b>Categoría:</b> ${esc(p.categoria||'')}</p><p><b>Duración:</b> ${esc(p.duracion||'No especificada')}</p><p><b>Garantía:</b> ${esc(p.garantia||'No especificada')}</p><p><b>Renovable:</b> ${esc(p.renovable||'No especificado')}</p>${p.stock!==''&&p.stock!==undefined?`<p><b>Disponibles:</b> ${esc(p.stock)}</p>`:''}${chars.length?`<h3>Características</h3><ul>${chars.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}<div class="actions"><button class="add" onclick="addCart('${enc(p.id)}')">＋ Agregar al carrito</button><button onclick="quickBuy('${enc(p.id)}')">Comprar ahora</button></div>`;$('detailModal').classList.add('show')}
function addCart(id){const p=allProducts.find(x=>String(x.id)===decodeURIComponent(id));if(!p)return;const found=cart.find(x=>String(x.id)===String(p.id));if(found)found.cantidad++;else cart.push({id:p.id,cantidad:1});saveCart();$('status').textContent='Producto agregado al carrito';}
function quickBuy(id){addCart(id);openCheckout()}
function openCart(){renderCart();$('cartModal').classList.add('show')}
function renderCart(){if(!cart.length){$('cartBody').innerHTML='<p class="muted">Tu carrito está vacío.</p>';return}let total=0;$('cartBody').innerHTML=cart.map(it=>{const p=allProducts.find(x=>String(x.id)===String(it.id));if(!p)return '';total+=Number(p.precio)*it.cantidad;return `<div class="cart-row"><div><b>${esc(p.nombre)}</b><br><span class="muted">${money(p.precio)} c/u</span></div><div class="qty"><button onclick="changeQty('${enc(it.id)}',-1)">−</button>${it.cantidad}<button onclick="changeQty('${enc(it.id)}',1)">+</button><button class="close" onclick="removeCart('${enc(it.id)}')">×</button></div></div>`}).join('')+`<div class="total">Total: ${money(total)}</div><button class="primary" onclick="openCheckout()">Continuar compra</button>`}
function changeQty(id,d){const it=cart.find(x=>String(x.id)===decodeURIComponent(id));if(!it)return;it.cantidad+=d;if(it.cantidad<1)cart=cart.filter(x=>x!==it);saveCart();renderCart()}
function removeCart(id){cart=cart.filter(x=>String(x.id)!==decodeURIComponent(id));saveCart();renderCart()}
function openCheckout(){if(!cart.length)return alert('Agrega al menos un producto al carrito');closeOverlay('cartModal');closeOverlay('detailModal');$('checkoutModal').classList.add('show')}
function sendOrder(){const cliente=$('cliente').value.trim(),telefono=$('telefono').value.trim();if(!cliente||!telefono)return alert('Completa tu nombre y WhatsApp');const items=cart.map(it=>({id:it.id,cantidad:it.cantidad}));api({action:'crearSolicitud',cliente,telefono,items:JSON.stringify(items)},r=>{if(!r.ok)return alert(r.error||'No se pudo registrar el pedido');cart=[];saveCart();closeOverlay('checkoutModal');window.open(r.whatsapp,'_blank')})}
function filterCategory(cat,btn){currentCategory=cat;document.querySelectorAll('.menu-panel button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');$('menu').classList.remove('open');renderProducts()}
function toggleMenu(){$('menu').classList.toggle('open')}function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('streamhub_theme',dark?'dark':'light');$('themeBtn').textContent=dark?'☀':'☾'}function closeOverlay(id){$(id).classList.remove('show')}
function saveCart(){localStorage.setItem('streamhub_cart',JSON.stringify(cart));updateCartCount()}function updateCartCount(){$('cartCount').textContent=cart.reduce((a,x)=>a+x.cantidad,0)}
function enc(s){return encodeURIComponent(String(s))}function $(id){return document.getElementById(id)}function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(localStorage.getItem('streamhub_theme')==='dark'){document.body.classList.add('dark');$('themeBtn').textContent='☀'}load();
</script></body></html>
